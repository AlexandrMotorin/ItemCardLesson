databaseChangeLog:
  - changeSet:
      id: 001-create-user-cards-table
      author: kilocode
      changes:
        - createTable:
            tableName: user_cards
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_user_cards
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: card_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: added_at
                  type: TIMESTAMP
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: LEARNING
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: user_cards
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_user_cards_user
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: user_cards
            baseColumnNames: card_id
            referencedTableName: word_cards
            referencedColumnNames: id
            constraintName: fk_user_cards_card
            onDelete: CASCADE
        - addUniqueConstraint:
            tableName: user_cards
            columnNames: user_id, card_id
            constraintName: uq_user_cards_user_card
