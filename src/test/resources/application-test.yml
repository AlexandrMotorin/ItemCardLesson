spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/english_words
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true

app:
  jwt:
    secret: test-jwt-secret-key-that-is-at-least-32-bytes-long-for-hs256
    expiration-ms: 86400000