spring:
  application:
    name: english-words-app

  datasource:
    url: jdbc:tc:postgresql:15-alpine:///english_words
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret

server:
  port: 8080

logging:
  level:
    org.springframework.security: DEBUG
    com.example.englishwordsapp: DEBUG
