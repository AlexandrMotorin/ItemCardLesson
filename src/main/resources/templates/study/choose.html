<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Study - Choose Sets</title>
</head>
<body>
    <div layout:fragment="content">
        <div th:replace="~{fragments/header :: header}"></div>

        <main class="container main-content">
            <div class="page-header">
                <h1>📚 Start New Study Session</h1>
                <p class="text-muted">Select word sets and exercise type</p>
            </div>

            <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

            <form th:action="@{/study/start}" method="POST" class="study-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <!-- Subscribed Sets -->
                <div th:if="${not #lists.isEmpty(subscribedSets)}" class="card mb-2">
                    <div class="card-header">
                        <h2>Your Subscribed Sets</h2>
                    </div>
                    <div class="card-body">
                        <div class="checkbox-group">
                            <div th:each="set : ${subscribedSets}" class="checkbox-item">
                                <label class="checkbox-label">
                                    <input type="checkbox" th:name="setIds" th:value="${set.id}" class="checkbox-input">
                                    <span class="checkbox-custom"></span>
                                    <span class="checkbox-text" th:text="${set.name}">Set Name</span>
                                    <span class="badge" th:text="${#lists.size(set.wordCards)} + ' words'">0 words</span>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Available Sets -->
                <div class="card mb-2">
                    <div class="card-header">
                        <h2>Available Sets</h2>
                    </div>
                    <div class="card-body">
                        <div class="checkbox-group">
                            <div th:each="set : ${availableSets}" class="checkbox-item">
                                <label class="checkbox-label">
                                    <input type="checkbox" th:name="setIds" th:value="${set.id}" class="checkbox-input">
                                    <span class="checkbox-custom"></span>
                                    <span class="checkbox-text" th:text="${set.name}">Set Name</span>
                                    <span class="badge" th:text="${#lists.size(set.wordCards)} + ' words'">0 words</span>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Exercise Type -->
                <div class="card mb-2">
                    <div class="card-header">
                        <h2>Exercise Type</h2>
                    </div>
                    <div class="card-body">
                        <div class="radio-group">
                            <div th:each="type : ${exerciseTypes}" class="radio-item">
                                <label class="radio-label">
                                    <input type="radio" th:name="exerciseType" th:value="${type.name()}" class="radio-input" th:checked="${type.name() == 'TEXT_INPUT'}">
                                    <span class="radio-custom"></span>
                                    <span class="radio-text">
                                        <th:block th:switch="${type.name()}">
                                            <th:block th:case="'TEXT_INPUT'">✏️ Text Input — Type the translation</th:block>
                                            <th:block th:case="'MULTIPLE_CHOICE'">🎯 Multiple Choice — Pick the correct answer</th:block>
                                        </th:block>
                                    </span>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="form-actions">
                    <a href="/cards" class="btn btn-ghost">Cancel</a>
                    <button type="submit" class="btn btn-primary">▶ Start Studying</button>
                </div>
            </form>
        </main>
    </div>
</body>
</html>
