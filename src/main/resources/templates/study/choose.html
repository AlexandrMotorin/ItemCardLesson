<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Study - Choose Sets</title>
</head>
<body>
    <div layout:fragment="content">
        <div th:replace="~{fragments/header :: header}"></div>

        <main class="container main-content">
            <div class="page-header">
                <h1>📚 Начать изучение</h1>
                <p class="text-muted">Выберите наборы слов для сессии</p>
            </div>

            <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

            <form id="studyForm" th:action="@{/study/start}" method="POST">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <!-- Subscribed Sets -->
                <div th:if="${not #lists.isEmpty(subscribedSets)}" class="study-sets-section">
                    <h2>📌 Подписанные наборы</h2>
                    <div class="sets-grid">
                        <div th:each="set : ${subscribedSets}"
                             class="set-card set-card-selectable"
                             th:attr="data-set-id=${set.id}"
                             role="checkbox" aria-checked="false" tabindex="0">
                            <input type="checkbox" name="setIds" th:value="${set.id}" class="set-card-checkbox">
                            <div class="set-card-header">
                                <h3 th:text="${set.name}">Set Name</h3>
                                <span class="set-word-count" th:text="${#lists.size(set.wordCards)} + ' слов'">0 слов</span>
                            </div>
                            <p class="set-description"
                               th:if="${set.description != null and !set.description.isEmpty()}"
                               th:text="${set.description}">Description</p>
                            <div class="set-card-check-indicator">✓</div>
                        </div>
                    </div>
                </div>

                <!-- Available Sets -->
                <div th:if="${not #lists.isEmpty(availableSets)}" class="study-sets-section">
                    <h2>🌟 Доступные наборы</h2>
                    <div class="sets-grid">
                        <div th:each="set : ${availableSets}"
                             class="set-card set-card-selectable"
                             th:attr="data-set-id=${set.id}"
                             role="checkbox" aria-checked="false" tabindex="0">
                            <input type="checkbox" name="setIds" th:value="${set.id}" class="set-card-checkbox">
                            <div class="set-card-header">
                                <h3 th:text="${set.name}">Set Name</h3>
                                <span class="set-word-count" th:text="${#lists.size(set.wordCards)} + ' слов'">0 слов</span>
                            </div>
                            <p class="set-description"
                               th:if="${set.description != null and !set.description.isEmpty()}"
                               th:text="${set.description}">Description</p>
                            <div class="set-card-check-indicator">✓</div>
                        </div>
                    </div>
                </div>

                <div class="form-actions">
                    <a href="/sets" class="btn btn-ghost">Отмена</a>
                    <button id="startBtn" type="submit" class="btn" disabled>▶ Начать изучение</button>
                </div>
            </form>
        </main>

        <script>
            (function() {
                const cards = document.querySelectorAll('.set-card-selectable');
                const startBtn = document.getElementById('startBtn');

                function updateStartButton() {
                    const anyChecked = document.querySelectorAll('.set-card-checkbox:checked').length > 0;
                    startBtn.disabled = !anyChecked;
                    startBtn.className = anyChecked ? 'btn btn-primary' : 'btn';
                }

                cards.forEach(function(card) {
                    card.addEventListener('click', function() {
                        const checkbox = card.querySelector('.set-card-checkbox');
                        checkbox.checked = !checkbox.checked;
                        card.classList.toggle('set-card-selected', checkbox.checked);
                        card.setAttribute('aria-checked', String(checkbox.checked));
                        updateStartButton();
                    });

                    card.addEventListener('keydown', function(e) {
                        if (e.key === ' ' || e.key === 'Enter') {
                            e.preventDefault();
                            card.click();
                        }
                    });
                });

                updateStartButton();
            })();
        </script>
    </div>
</body>
</html>
