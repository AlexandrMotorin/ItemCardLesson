<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="layout">
<head>
    <title layout:fragment="title">Word Sets — English Words App</title>
    <th:block layout:fragment="head">
    </th:block>
</head>
<body>
    <th:block layout:fragment="content">
        <div th:replace="fragments/header :: header"></div>

        <!-- Confirm delete modal (reusable) -->
        <div th:replace="~{fragments/confirm-modal :: confirmModal}"></div>

        <div class="container">
            <div class="page-content">
                <div class="page-header">
                    <h1>📚 Word Sets</h1>
                    <p>Browse, create, and subscribe to word collections</p>
                </div>

                <div class="alert alert-success" th:if="${successMessage != null}" th:text="${successMessage}">
                    Success
                </div>

                <!-- My Sets -->
                <div class="sets-section" th:if="${mySets != null and !mySets.isEmpty()}">
                    <h2>📂 My Sets</h2>
                    <div class="sets-grid">
                        <div class="set-card set-card-clickable"
                             th:each="set : ${mySets}"
                             th:attr="data-href=@{/sets/{id}(id=${set.id})}">
                            <div class="set-card-header">
                                <h3 th:text="${set.name}">Set Name</h3>
                                <span class="set-word-count" th:text="${#lists.size(set.wordCards)} + ' words'">0 words</span>
                            </div>
                            <p class="set-description" th:if="${set.description != null and !set.description.isEmpty()}"
                               th:text="${set.description}">Description</p>
                            <div class="set-card-actions">
                                <!-- hidden delete form -->
                                <form th:id="'delete-form-' + ${set.id}"
                                      th:action="@{/sets/{id}/delete(id=${set.id})}" method="POST"
                                      style="display:none;">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                </form>
                                <button type="button"
                                        class="btn-icon btn-icon-danger"
                                        th:attr="data-delete-form='delete-form-' + ${set.id}"
                                        data-delete-message="Удалить этот набор? Это действие нельзя отменить."
                                        title="Удалить набор"
                                        onclick="event.stopPropagation()">🗑</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Available (System) Sets -->
                <div class="sets-section" th:if="${availableSets != null}">
                    <h2>🌟 Available Sets</h2>
                    <div class="sets-grid">
                        <div class="set-card set-card-clickable"
                             th:each="set : ${availableSets}"
                             th:attr="data-href=@{/sets/{id}(id=${set.id})}">
                            <div class="set-card-header">
                                <h3 th:text="${set.name}">Set Name</h3>
                                <span class="set-word-count" th:text="${#lists.size(set.wordCards)} + ' words'">0 words</span>
                            </div>
                            <p class="set-description" th:if="${set.description != null and !set.description.isEmpty()}"
                               th:text="${set.description}">Description</p>
                            <div class="set-card-actions">
                                <form th:action="@{/sets/{id}/subscribe(id=${set.id})}" method="POST"
                                      style="display:inline;" onclick="event.stopPropagation()">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                    <button type="submit" class="btn btn-sm btn-success">➕ Subscribe</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Subscribed Sets -->
                <div class="sets-section" th:if="${subscribedSets != null and !subscribedSets.isEmpty()}">
                    <h2>📌 Subscribed Sets</h2>
                    <div class="sets-grid">
                        <div class="set-card set-card-clickable"
                             th:each="set : ${subscribedSets}"
                             th:attr="data-href=@{/sets/{id}(id=${set.id})}">
                            <div class="set-card-header">
                                <h3 th:text="${set.name}">Set Name</h3>
                                <span class="set-word-count" th:text="${#lists.size(set.wordCards)} + ' words'">0 words</span>
                            </div>
                            <p class="set-description" th:if="${set.description != null and !set.description.isEmpty()}"
                               th:text="${set.description}">Description</p>
                            <div class="set-card-actions" onclick="event.stopPropagation()">
                                <form th:action="@{/sets/{id}/unsubscribe(id=${set.id})}" method="POST" style="display:inline;">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                    <button type="submit" class="btn btn-sm btn-secondary">➖ Unsubscribe</button>
                                </form>
                                <form th:action="@{/sets/{id}/fork(id=${set.id})}" method="POST" style="display:inline;">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                    <button type="submit" class="btn btn-sm">🍴 Fork</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="empty-state" th:if="${(availableSets == null or availableSets.isEmpty()) and (mySets == null or mySets.isEmpty()) and (subscribedSets == null or subscribedSets.isEmpty())}">
                    <div class="empty-icon">📚</div>
                    <p>No word sets available.</p>
                </div>

                <div class="mt-4" style="text-align: center;">
                    <a href="/sets/new" class="btn">➕ Create New Set</a>
                </div>
            </div>
        </div>

        <script>
            // Make cards with data-href navigable by click
            document.querySelectorAll('.set-card-clickable[data-href]').forEach(function(card) {
                card.addEventListener('click', function() {
                    window.location.href = card.dataset.href;
                });
            });
        </script>
    </th:block>
</body>
</html>
