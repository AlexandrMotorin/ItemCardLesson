<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="layout">
<head>
    <title layout:fragment="title">Create Set — English Words App</title>
    <th:block layout:fragment="head">
    </th:block>
</head>
<body>
    <th:block layout:fragment="content">
        <div th:replace="fragments/header :: header"></div>

        <div class="container">
            <div class="page-content">
                <div class="page-header">
                    <h1>➕ Create New Set</h1>
                    <p>Create a new word collection</p>
                </div>

                <div class="card-surface">
                    <form th:action="@{/sets/create}" method="POST">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                        <div class="form-group">
                            <label for="name">Set Name *</label>
                            <input type="text" id="name" name="name" placeholder="Enter a name for your set" required>
                        </div>

                        <div class="form-group">
                            <label for="description">Description</label>
                            <textarea id="description" name="description" rows="3" placeholder="Describe what this set is about"></textarea>
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn">✅ Create Set</button>
                            <a href="/sets" class="btn btn-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </th:block>
</body>
</html>
