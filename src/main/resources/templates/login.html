<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="layout">
<head>
    <title layout:fragment="title">Sign In — English Words App</title>
    <th:block layout:fragment="head">
    </th:block>
</head>
<body>
    <th:block layout:fragment="content">
        <div class="auth-page">
            <div class="auth-container">
                <div class="auth-header">
                    <span class="auth-icon">📚</span>
                    <h1>Welcome Back</h1>
                    <p>Sign in to continue learning</p>
                </div>

                <!-- Error alert: invalid credentials -->
                <div class="alert alert-error" th:if="${param.error != null}">
                    <span>⚠️</span>
                    <span>Invalid username or password. Please try again.</span>
                </div>

                <!-- Success alert: logged out -->
                <div class="alert alert-success" th:if="${param.logout != null}">
                    <span>👋</span>
                    <span>You have been logged out successfully.</span>
                </div>

                <!-- Success alert: registered -->
                <div class="alert alert-success" th:if="${param.registered != null}">
                    <span>✅</span>
                    <span>Account created successfully! Please sign in.</span>
                </div>

                <form class="auth-form" th:action="@{/login}" method="POST">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                    <div class="form-group">
                        <label for="username">Username or Email <span class="required">*</span></label>
                        <input type="text" id="username" name="username"
                               placeholder="Enter your username or email"
                               required autofocus>
                    </div>

                    <div class="form-group">
                        <label for="password">Password <span class="required">*</span></label>
                        <input type="password" id="password" name="password"
                               placeholder="Enter your password"
                               required>
                    </div>

                    <button type="submit" class="btn btn-primary btn-full">Sign In</button>
                </form>

                <div class="auth-divider">
                    <span>or continue with</span>
                </div>

                <div class="oauth-buttons">
                    <a href="/oauth2/authorization/google" class="oauth-btn oauth-btn-google">
                        <svg class="oauth-icon" viewBox="0 0 48 48" width="20" height="20">
                            <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/>
                            <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/>
                            <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/>
                            <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/>
                        </svg>
                        <span>Continue with Google</span>
                    </a>
                </div>

                <div class="auth-footer">
                    <p>Don't have an account? <a href="/register">Register</a></p>
                </div>
            </div>
        </div>
    </th:block>
</body>
</html>
